<!-- ui-refresh logo concept (screens SCR-04, spec §8 open question). Not shipped: AppLogo and
     public/icons are drawn from it once the owner approves the artwork. 32×32 mark grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5BFF" />
      <stop offset="1" stop-color="#A35BFF" />
    </linearGradient>
    <symbol id="mark" viewBox="0 0 32 32">
      <path d="M5 14V8a3 3 0 0 1 3-3h6" fill="none" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M27 18v6a3 3 0 0 1-3 3h-6" fill="none" stroke="currentColor" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="21" cy="11" r="3" fill="currentColor" />
    </symbol>
    <symbol id="mark-gradient" viewBox="0 0 32 32">
      <path d="M5 14V8a3 3 0 0 1 3-3h6" fill="none" stroke="url(#brand)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M27 18v6a3 3 0 0 1-3 3h-6" fill="none" stroke="url(#brand)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="21" cy="11" r="3" fill="url(#brand)" />
    </symbol>
  </defs>

  <!-- A: top bar, dark theme (#15122A), mark 24 px + wordmark -->
  <rect x="0" y="0" width="380" height="150" fill="#15122A" />
  <use href="#mark-gradient" x="40" y="51" width="48" height="48" />
  <text x="102" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" letter-spacing="-1" fill="#ECEAFF">imgly</text>

  <!-- B: top bar, light theme (#F4F2FF) -->
  <rect x="380" y="0" width="380" height="150" fill="#F4F2FF" />
  <use href="#mark-gradient" x="420" y="51" width="48" height="48" />
  <text x="482" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" letter-spacing="-1" fill="#1E1A3D">imgly</text>

  <!-- C: app icon 512 (any purpose) at 120 px: white mark on the brand gradient, rounded square -->
  <rect x="0" y="150" width="760" height="150" fill="#2A2D35" />
  <rect x="40" y="165" width="120" height="120" rx="26" fill="url(#brand)" />
  <use href="#mark" x="64" y="189" width="72" height="72" color="#FFFFFF" />

  <!-- D: maskable 512 at 120 px: full-bleed gradient, mark inside the 80 % safe circle -->
  <rect x="190" y="165" width="120" height="120" fill="url(#brand)" />
  <circle cx="250" cy="225" r="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <use href="#mark" x="222" y="197" width="56" height="56" color="#FFFFFF" />

  <!-- E: favicon at real 16 px and 32 px, on a light and a dark tab -->
  <rect x="340" y="185" width="180" height="40" rx="8" fill="#F1F3F4" />
  <use href="#mark-gradient" x="352" y="197" width="16" height="16" />
  <text x="376" y="210" font-family="system-ui, sans-serif" font-size="13" fill="#202124">imgly</text>
  <rect x="340" y="235" width="180" height="40" rx="8" fill="#35363A" />
  <use href="#mark-gradient" x="352" y="247" width="16" height="16" />
  <text x="376" y="260" font-family="system-ui, sans-serif" font-size="13" fill="#E8EAED">imgly</text>
  <use href="#mark-gradient" x="560" y="193" width="32" height="32" />
  <rect x="610" y="185" width="48" height="48" rx="11" fill="url(#brand)" />
  <use href="#mark" x="618" y="193" width="32" height="32" color="#FFFFFF" />
</svg>
